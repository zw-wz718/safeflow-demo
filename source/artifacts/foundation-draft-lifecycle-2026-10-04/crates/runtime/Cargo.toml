[package]
name = "safeflow-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Deterministic orchestration runtime for SafeFlow"

[dependencies]
safeflow-contracts = { path = "../contracts" }
safeflow-bank-gateway = { path = "../bank-gateway" }
chrono = { version = "=0.4.38", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex = "=1.10.4"
regex-syntax = "=0.8.11"
reqwest = { version = "=0.12.24", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.36", features = ["time"] }
zeroize = "=1.7.0"

[dev-dependencies]
axum = "=0.7.9"
futures-util = "0.3"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
