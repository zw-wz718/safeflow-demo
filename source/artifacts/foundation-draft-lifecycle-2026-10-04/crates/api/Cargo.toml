[package]
name = "safeflow-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Loopback project simulation HTTP assembly for persisted read-only tasks"

[dependencies]
safeflow-billing-source-reader = { path = "../../members/jonathan/backend/src/features/billing" }
safeflow-card-facts = { path = "../../features/card" }
safeflow-card-runtime-adapter = { path = "../../features/card/runtime-adapter" }
safeflow-contracts = { path = "../contracts" }
safeflow-runtime = { path = "../runtime" }
safeflow-storage = { path = "../storage" }
safeflow-bank-gateway = { path = "../bank-gateway" }
safeflow-mock-bank = { path = "../mock-bank" }
safeflow-transfer-integration = { path = "../transfer" }
chrono = { version = "=0.4.38", default-features = false, features = ["std", "serde"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
axum = "=0.7.9"
cookie = "=0.18.1"
mime = "=0.3.17"
# Keep the new cookie dependency compatible with the declared Rust baseline.
time = "=0.3.36"
tokio = { version = "1.36", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
getrandom = "=0.2.17"
subtle = "=2.6.1"
zeroize = "=1.7.0"

[dev-dependencies]
safeflow-subscription-evidence = { path = "../../features/subscription", features = ["postgres-mock-store"] }
safeflow-card-postgres-store = { path = "../../features/card/postgres-store" }
tower = { version = "=0.5.2", features = ["util"] }
http-body-util = "=0.1.3"
hyper = { version = "=1.6.0", features = ["client", "http1"] }
hyper-util = { version = "=0.1.12", features = ["tokio"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres"] }
uuid = { version = "=1.8.0", features = ["v4"] }
