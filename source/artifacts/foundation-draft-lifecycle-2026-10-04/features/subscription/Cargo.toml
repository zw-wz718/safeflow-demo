[package]
name = "safeflow-subscription-evidence"
version = "0.1.0"
edition = "2021"
publish = false
description = "Offline subscription evidence, ledger matching and simulated confirmation; no production writes"

[features]
postgres-mock-store = ["dep:sqlx", "dep:tokio"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
sqlx = { version = "=0.8.6", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "json"] }
tokio = { version = "=1.53.2", optional = true, features = ["macros", "rt-multi-thread"] }
